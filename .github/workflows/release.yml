name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Queue release runs so a newer push cannot cancel an in-flight GoReleaser
  # publish before the Homebrew tap update lands.
  group: ${{ github.workflow }}:${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: matt-riley/matt-riley-ci/.github/workflows/release-please.yml@cb986078a5bd4775e5fb05348f3618e41fedf4de # v4
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      component-output-key: cli
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  dispatch-goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.component_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Start tag publisher when Release Please uses GITHUB_TOKEN
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.component_tag_name }}
          RELEASE_TOKEN_AVAILABLE: ${{ secrets.RELEASE_PLEASE_TOKEN != '' }}
        run: |
          if [ "$RELEASE_TOKEN_AVAILABLE" = true ]; then
            echo 'The release token starts the tag publisher automatically.'
          else
            gh workflow run goreleaser.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
          fi
