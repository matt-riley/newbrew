name: Release

"on":
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Queue release runs so a newer push cannot cancel an in-flight GoReleaser
  # publish before the Homebrew tap update lands.
  group: ${{ github.workflow }}:${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: matt-riley/matt-riley-ci/.github/workflows/release-please.yml@0a310f1286537ed4fd000af4b35cd6459b00448d # v4
    with:
      config-file: release-please-config.json
      manifest-file: .release-please-manifest.json
      component-output-key: cli
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.component_release_created == 'true' }}
    uses: ./.github/workflows/goreleaser.yml
    with:
      tag: ${{ needs.release-please.outputs.component_tag_name }}
    secrets:
      github-token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
      private-key: ${{ secrets.PRIVATE_KEY }}
      homebrew-tap-token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
